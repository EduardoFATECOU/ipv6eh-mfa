# ipsec.conf - StrongSwan/IKEv2 (TEMPLATE, Cap. 5/7 e Anexo C)
#
# ESP em MODO TRANSPORTE entre pares de agentes, AES-256-GCM, lifetime de
# 8 h / 100 MB e autenticacao mutua por certificados X.509. O modo transporte
# preserva os cabecalhos de extensao IPv6 que carregam a opcao MFA (0x1E).
#
# Este arquivo versionado e o template: o deploy_vms.sh chama ipsec/gerar_conf.sh
# para resolver os campos da VM local e gerar uma conexao por par. Nao edite
# /etc/ipsec.conf nas VMs manualmente.
#
# Campos preenchidos pelo gerador:
#   esquerda (local): IPv6, ID (FQDN) e certificado da VM
#   direita (peer):   IPv6, ID (FQDN) e certificado de cada par
#
# A opcao MFA trafega na camada IPv6 (Destination Options); o IKEv2 aqui
# apenas protege o canal entre agentes. Nao ha eXAuth: o desafio MFA e
# responsabilidade do AD/AM, nao do StrongSwan.

config setup
    strictcrlpolicy=no
    charondebug="ike 1, esp 1, net 1, cfg 1, chd 1"

conn %default
    type=transport
    keyexchange=ikev2
    left=@IPV6@
    leftid=@NOME@.@DOMINIO@
    leftcert=/etc/ipsec.d/certs/@NOME@-cert.pem
    ike=aes256-sha256-ecp256,aes256-sha384-ecp384
    esp=aes256gcm16-ecp256
    lifetime=8h
    lifebytes=104857600
    rekeymargin=5m
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s
    auto=start

# As conexoes (uma por par) sao inseridas abaixo por gerar_conf.sh.
# >>> CONNS
