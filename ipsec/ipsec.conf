# ipsec.conf - StrongSwan para o ambiente de experimentacao (4 VMs Ubuntu 24.04)
# Frente 2 da tese: ESP/AH protegendo o trafego que carrega a opcao MFA
# em IPv6 Destination Options (RFC 9099). Substitua os IPs conforme as VMs.

config setup
    strictcrlpolicy=no
    charondebug="ike 1, esp 1, net 1, cfg 1, chd 1"

# Conexao site-to-site entre o cliente e o servidor de autenticacao
conn mfa-tunnel
    type=tunnel
    left=%defaultroute
    leftid=@cliente.lars.unesp.br
    leftsubnet=2001:db8:1::/64
    right=2001:db8:2::1
    rightid=@servidor.lars.unesp.br
    rightsubnet=2001:db8:2::/64
    # IKEv2 com PRF AES-CMAC e DH GROUP19 (ECP-256)
    ike=aes256gcm16-prfsha384-modp2048,aes256-sha384-ecp256
    esp=aes256gcm16-ecp256,aes256-sha384-ecp256
    # PFS (Perfect Forward Secrecy)
    keyexchange=ikev2
    rekey_time=2h
    rekey_margin=5m
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s

# Conexao de autenticacao com extensao eXAuth (desafio MFA por fator)
conn mfa-xauth
    left=%defaultroute
    leftid=@cliente.lars.unesp.br
    right=2001:db8:2::1
    rightid=@servidor.lars.unesp.br
    keyexchange=ikev2
    # eap-mschapv2 como transporte do desafio TOTP/biometria (placeholder)
    leftauth=eap-mschapv2
    rightauth=eap-mschapv2
    eap_identity=%identity
